<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor de ISBN — Teste</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb; color: #2b2b2b; min-height: 100vh;
      padding: 1rem; display: flex; flex-direction: column; gap: 1rem;
    }
    h1 { font-size: 1.2rem; text-align: center; color: #2c6e9e; }
    .subtitle { text-align: center; font-size: .85rem; color: #6b7280; }
    #reader {
      width: 100%; max-width: 500px; margin: 0 auto;
      border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4/3;
    }
    .buttons { display: flex; gap: .5rem; max-width: 500px; margin: 0 auto; width: 100%; }
    button {
      flex: 1; padding: .9rem; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity .2s;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #start-btn { background: #2c6e9e; color: #fff; }
    #stop-btn { background: #c0392b; color: #fff; }
    #result {
      max-width: 500px; margin: 0 auto; width: 100%;
      background: #fff; padding: 1.2rem; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center;
    }
    #result .label {
      font-size: .8rem; color: #6b7280; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: .3rem;
    }
    #result .code {
      font-size: 1.6rem; font-weight: 700; color: #2c6e9e;
      font-family: monospace; word-break: break-all;
    }
    #result.isbn .code { color: #27ae60; }
    #copy-btn {
      margin-top: .8rem; padding: .5rem 1rem; font-size: .85rem;
      background: #f2a71b; color: #fff; border: none; border-radius: 6px; cursor: pointer;
    }
    #history {
      max-width: 500px; margin: 0 auto; width: 100%;
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 1rem;
    }
    #history h3 { font-size: .9rem; color: #6b7280; margin-bottom: .6rem; }
    #history ul { list-style: none; }
    #history li {
      padding: .5rem 0; border-bottom: 1px solid #eee;
      font-family: monospace; font-size: .9rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    #history li:last-child { border-bottom: none; }
    .status { text-align: center; font-size: .85rem; color: #6b7280; max-width: 500px; margin: 0 auto; }
    .error {
      background: #fee; color: #c0392b; padding: 1rem; border-radius: 8px;
      max-width: 500px; margin: 0 auto; text-align: center; font-size: .9rem;
    }
  </style>
</head>
<body>

  <h1>📚 Leitor de ISBN — Teste</h1>
  <p class="subtitle">Aponte a câmera para o código de barras do livro</p>

  <div id="reader"></div>

  <div class="buttons">
    <button id="start-btn">▶️ Iniciar Câmera</button>
    <button id="stop-btn" disabled>⏸️ Parar</button>
  </div>

  <div id="result">
    <div class="label">Último código lido</div>
    <div class="code" id="code-display">—</div>
    <button id="copy-btn" style="display:none;">📋 Copiar ISBN</button>
  </div>

  <div id="history">
    <h3>Histórico desta sessão</h3>
    <ul id="history-list">
      <li style="color:#aaa;font-style:italic;justify-content:center;">Nada lido ainda</li>
    </ul>
  </div>

  <p class="status" id="status">Câmera desligada</p>

  <script>
    if (typeof Html5Qrcode === 'undefined') {
      document.body.innerHTML = '<h1 style="color:#c0392b;text-align:center;padding:2rem;">Erro: biblioteca não carregou. Verifique a internet e recarregue.</h1>';
      throw new Error('html5-qrcode não carregou');
    }

    const startBtn = document.getElementById('start-btn');
    const stopBtn  = document.getElementById('stop-btn');
    const codeDisplay = document.getElementById('code-display');
    const copyBtn  = document.getElementById('copy-btn');
    const resultBox = document.getElementById('result');
    const statusEl = document.getElementById('status');
    const historyList = document.getElementById('history-list');

    let html5QrCode = null;
    let lastCode = '';
    let lastCodeTime = 0;
    let history = [];

    function isISBN(code) {
      const clean = code.replace(/[^0-9X]/gi, '');
      if (clean.length === 13 && (clean.startsWith('978') || clean.startsWith('979'))) return true;
      if (clean.length === 10) return true;
      return false;
    }

    function beep() {
      if (navigator.vibrate) navigator.vibrate(80);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; osc.type = 'sine';
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.start(); osc.stop(ctx.currentTime + 0.15);
      } catch(e) { /* silencioso */ }
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (decodedText === lastCode && now - lastCodeTime < 2000) return;
      lastCode = decodedText; lastCodeTime = now;

      const isbn = isISBN(decodedText);
      codeDisplay.textContent = decodedText;
      resultBox.classList.toggle('isbn', isbn);
      copyBtn.style.display = 'inline-block';
      copyBtn.textContent = isbn ? '📋 Copiar ISBN' : '📋 Copiar código';

      beep();

      if (!history[0] || history[0].code !== decodedText) {
        history.unshift({ code: decodedText, isbn, time: new Date().toLocaleTimeString('pt-BR') });
        if (history.length > 20) history.pop();
        renderHistory();
      }
    }

    function renderHistory() {
      historyList.innerHTML = history.map(item => `
        <li>
          <span style="color:${item.isbn ? '#27ae60' : '#2b2b2b'};">
            ${item.isbn ? '✅' : '•'} ${item.code}
          </span>
          <span style="color:#aaa;font-size:.8rem;">${item.time}</span>
        </li>
      `).join('');
    }

    function onScanError() { /* silencioso: erros de "não achou" são normais */ }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      statusEl.textContent = 'Solicitando acesso à câmera...';

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader", {
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.CODE_128
            ],
            verbose: false
          });
        }

        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 300, height: 180 }, aspectRatio: 1.333 },
          onScanSuccess,
          onScanError
        );

        statusEl.textContent = '✅ Câmera ativa. Aponte para o ISBN.';
        stopBtn.disabled = false;
      } catch (err) {
        startBtn.disabled = false;
        statusEl.textContent = '❌ Não foi possível acessar a câmera.';
        console.error(err);
        showError(err.message || String(err));
      }
    });

    stopBtn.addEventListener('click', async () => {
      if (!html5QrCode) return;
      try {
        await html5QrCode.stop();
        statusEl.textContent = 'Câmera parada.';
        startBtn.disabled = false;
        stopBtn.disabled = true;
      } catch (err) { console.error(err); }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(lastCode);
        copyBtn.textContent = '✅ Copiado!';
        setTimeout(() => {
          copyBtn.textContent = isISBN(lastCode) ? '📋 Copiar ISBN' : '📋 Copiar código';
        }, 1500);
      } catch (err) {
        prompt('Copie manualmente:', lastCode);
      }
    });

    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error';
      div.innerHTML = `
        <strong>⚠️ Erro de câmera</strong><br>${msg}<br><br>
        <small>Verifique se:<br>
        • Você está acessando via <strong>HTTPS</strong> (GitHub Pages e Vercel fornecem)<br>
        • Deu permissão de câmera ao navegador<br>
        • Está usando Chrome, Edge ou Safari recente</small>`;
      document.body.insertBefore(div, document.getElementById('result'));
    }

    window.addEventListener('beforeunload', () => {
      if (html5QrCode) { try { html5QrCode.stop(); } catch(e) {} }
    });
  </script>
</body>
  </html>
